services:
  - type: web
    name: healthcare-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: ENVIRONMENT
        value: development
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_EMAIL
        value: admin@superhumanly.ai
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: healthcare-db
    plan: free
